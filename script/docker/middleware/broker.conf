# RocketMQ Broker 配置（host 网络单机）
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
namesrvAddr = 127.0.0.1:9876

# 关键：向 NameServer 注册的对外地址。host 网络下必须为 127.0.0.1，
# 否则 yudao-server 从 NameServer 拿到容器内网 IP 会连不上 Broker。
brokerIP1 = 127.0.0.1

# 允许自动创建 Topic / 消费组（开发便捷；生产建议关闭并手动建）
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
