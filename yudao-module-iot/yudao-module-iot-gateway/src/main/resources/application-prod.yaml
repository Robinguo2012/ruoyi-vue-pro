# ============================================================================
# IoT 网关 生产环境配置（prod profile）
# ----------------------------------------------------------------------------
# 只覆盖需按环境注入 / 生产收紧的项，其余继承 application.yaml。
# 敏感信息（Redis、EMQX MQTT 账号密码、Token 密钥）一律用环境变量注入。
# ============================================================================

spring:
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:0}
    password: ${REDIS_PASSWORD:} # 无密码则留空
    timeout: 30000ms

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: ${spring.application.name}_PRODUCER

yudao:
  iot:
    message-bus:
      type: redis
    gateway:
      rpc:
        url: ${IOT_RPC_URL:http://127.0.0.1:48080} # 主程序 yudao-server API 地址
        connect-timeout: 30s
        read-timeout: 30s
      token:
        secret: ${IOT_GATEWAY_TOKEN_SECRET} # 【必填】Token 密钥，至少 32 位
        expiration: 7d
      app-product-keys:
        - ${IOT_APP_PRODUCT_KEY:ke5EYZurCB3FwFXp}
      protocols:
        # 生产对接外部 EMQX Broker
        - id: emqx-1
          enabled: true
          protocol: emqx
          port: 8090 # EMQX HTTP Hook 端口
          emqx:
            mqtt-host: ${EMQX_HOST:127.0.0.1}
            mqtt-port: ${EMQX_PORT:1883}
            mqtt-username: ${EMQX_USERNAME:admin} # 【建议注入】
            mqtt-password: ${EMQX_PASSWORD} # 【必填】原硬编码密码改为环境变量
            mqtt-client-id: iot-gateway-mqtt
            mqtt-ssl: ${EMQX_SSL:false}
            mqtt-topics:
              - "/sys/#"
            mqtt-qos: 1
            clean-session: true
            keep-alive-interval-seconds: 60
            max-inflight-queue: 10000
            connect-timeout-seconds: 10
            reconnect-delay-ms: 5000
            trust-all: false # 生产必须 false
            http:
              ssl-enabled: false
            will:
              enabled: true # 生产开启遗嘱消息
              topic: "gateway/status/iot-gateway-mqtt"
              payload: "offline"
              qos: 1
              retain: true

logging:
  file:
    name: ${user.home}/logs/${spring.application.name}.log
  level:
    root: INFO
    cn.iocoder.yudao.module.iot.gateway: INFO
    org.apache.rocketmq: WARN

debug: false
